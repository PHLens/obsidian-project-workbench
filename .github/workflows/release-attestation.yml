name: Release artifact attestation

on:
  release:
    types: [published]

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --dir release-assets --repo "${{ github.repository }}"
      - name: Attest plugin assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css

  <rect x="320" y="420" width="818" height="270" rx="13" fill="#fff" stroke="#5b78ad" stroke-width="2"/><rect x="320" y="420" width="5" height="270" rx="2" fill="#5b78ad"/><text x="344" y="452" font-family="Arial,sans-serif" font-size="12" fill="#315a9b">本阶段关注</text><text x="344" y="484" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24344f">复杂场景下的迁移能力边界</text><rect x="1002" y="464" width="100" height="28" rx="14" fill="#e7eefb"/><text x="1019" y="483" font-family="Arial,sans-serif" font-size="12" fill="#315a9b">Exploring</text><text x="344" y="520" font-family="Arial,sans-serif" font-size="14" fill="#61728c">识别复杂场景引入的新约束，明确当前方案的适用范围与缺口。</text><text x="344" y="551" font-family="Arial,sans-serif" font-size="12" fill="#7b8aa0">阶段 evaluation　角色 mainline　标签 能力边界　实验</text>

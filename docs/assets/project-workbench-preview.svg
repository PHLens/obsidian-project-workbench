  <text x="344" y="724" font-family="Arial,sans-serif" font-size="12" fill="#7b8aa0">待首次整理</text><text x="900" y="724" font-family="Arial,sans-serif" font-size="13" fill="#315a9b">＋ 添加资料　查看资料　更多</text>
  <rect x="320" y="720" width="818" height="148" rx="13" fill="#fff" stroke="#d7e0ec"/><text x="344" y="758" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24344f">低精度约束的正确性验证</text><rect x="1002" y="739" width="100" height="28" rx="14" fill="#f0f4fc"/><text x="1019" y="758" font-family="Arial,sans-serif" font-size="12" fill="#315a9b">Proposed</text><text x="344" y="793" font-family="Arial,sans-serif" font-size="14" fill="#61728c">梳理不同精度设置下的误差来源，确定可接受的验证标准。</text><line x1="344" y1="812" x2="1112" y2="812" stroke="#d7e0ec"/><text x="344" y="839" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#24344f">Next Step</text><text x="900" y="839" font-family="Arial,sans-serif" font-size="13" fill="#315a9b">2 项　原文</text>


  <text x="320" y="147" font-family="Arial,sans-serif" font-size="13" fill="#7b8aa0">研究项目</text><text x="320" y="190" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#24344f">KORAM</text><text x="320" y="226" font-family="Arial,sans-serif" font-size="16" fill="#61728c">让 LLM agent 参与高性能 kernel 开发，并明确跨后端迁移能力边界。</text>
